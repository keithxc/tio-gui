name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native Windows x64 (UCRT64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            gcc:p
            cmake:p
            ninja:p
            pkgconf:p
            gtk4:p
            pcre2:p
            json-glib:p
            gettext-tools:p
            python:p
            openssl:p
      - name: Record dependency versions
        run: pacman -Q > windows-dependencies.txt
      - name: Configure desktop and serial agent
        run: >-
          cmake -S . -B build-windows -G Ninja
          -DTIO_GUI_SERIAL_ONLY=ON
          -DTIO_GUI_BUILD_AGENT=ON
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build desktop and serial agent
        run: cmake --build build-windows --parallel 2
      - name: Run native Windows tests
        run: ctest --test-dir build-windows --output-on-failure --timeout 60
      - name: Check executable versions
        run: |
          ./build-windows/tio-gui.exe --version
          ./build-windows/tio-serial-agent.exe --version
      - name: Keep build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ucrt64-diagnostics
          path: |
            windows-dependencies.txt
            build-windows/CMakeFiles/CMakeConfigureLog.yaml
            build-windows/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      diagnose_default_renderer:
        description: Also diagnose the hosted runner's default OpenGL renderer
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Apple Silicon desktop and serial agent
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.1
      - name: Configure with the locked Nix development environment
        run: >-
          nix develop --no-update-lock-file -c cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DTIO_GUI_BUILD_AGENT=ON -DBUILD_TESTING=ON
      - name: Build
        id: native_build
        run: nix develop --no-update-lock-file -c cmake --build build --parallel 3
      - name: Test
        env:
          # The hosted runner stalls at frame 0 with GskGLRenderer. Cairo runs
          # the same native widgets and transport assertions; default-renderer
          # coverage is also exercised during physical Mac package acceptance.
          GSK_RENDERER: cairo
        run: nix develop --no-update-lock-file -c ctest --test-dir build --output-on-failure
      - name: Diagnose the default renderer (manual)
        if: always() && steps.native_build.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.diagnose_default_renderer
        env:
          GSK_RENDERER: gl
          GSK_DEBUG: renderer
        # Preserve the functional test log before the optional diagnostic run.
        run: |
          cp build/Testing/Temporary/LastTest.log build/cairo-functional-last-test.log
          nix develop --no-update-lock-file -c ctest --test-dir build --output-on-failure \
            -R '^(serial-ui|native-tools-ui)$' --output-log build/opengl-diagnostics.log
      - name: Test macOS runtime relocation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: /usr/bin/python3 tests/macos_packaging_test.py "$RUNNER_TEMP/tio-gui-packaging"
      - name: Keep test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-diagnostics
          path: |
            build/Testing/Temporary/LastTest.log
            build/cairo-functional-last-test.log
            build/opengl-diagnostics.log
          if-no-files-found: warn
          retention-days: 14
